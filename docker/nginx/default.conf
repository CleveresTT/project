server {
    listen 80 default_server;
    server_name localhost;
    root /var/www/project/frontend/dist;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Проксирование на 8080 порт, чтобы не указывать его в адресной строке
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Проксирование API на backend-контейнер
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/project/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/project/backend/public;
        fastcgi_pass backend:9000;  # <-- имя сервиса backend
    }
}
