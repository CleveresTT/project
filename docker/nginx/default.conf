server {
    listen 80 default_server;
    server_name localhost;
    root /var/www/project/frontend/dist;
    index index.html;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Открыть SPA 
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Проксирование API на backend-контейнер
    location /api/ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/project/backend/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/project/backend/public;
        fastcgi_pass backend:9000;  # <-- имя сервиса backend
    }
}
