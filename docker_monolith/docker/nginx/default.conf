server {
    listen 80;
    server_name localhost;
    root /var/www/project/frontend/dist;

    index index.html;

    # API-маршруты Symfony (начинаются с /api, /login, /admin и т.п.)
    location /api/ {
        root /var/www/project/backend/public;
        try_files $uri /index.php$is_args$args;
    }
    
    location / {
        # Пытаемся найти файл/папку, иначе отдаём index.html (history mode)
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        internal;   # запрещает прямое обращение из браузера к .php
        root /var/www/project/backend/public;

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
        fastcgi_param DOCUMENT_ROOT /var/www/project/backend/public;
    }

    # Защита скрытых файлов
    location ~ /\.ht {
        deny all;
    }
}
